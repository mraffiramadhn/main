name: Validate Treasury JavaScript
on:
  push:
    branches: [main]
    paths:
      - 'treasury/index.html'
      - '.github/workflows/validate-treasury.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract inline scripts and syntax-check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('treasury/index.html').read_text()
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          Path('/tmp/treasury-inline-scripts').mkdir(exist_ok=True)
          for i,script in enumerate(scripts):
              Path(f'/tmp/treasury-inline-scripts/script-{i}.js').write_text(script)
          print(f'Extracted {len(scripts)} inline scripts')
          PY
          for file in /tmp/treasury-inline-scripts/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
