<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#303841">
<link rel="icon" type="image/png" href="/favicon-baru1.png?v=2">
<title>Buat Password Baru — Treasury X1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#303841;--panel:#2F4A63;--panel2:#263746;--line:rgba(239,232,221,.18);--text:#EFE8DD;--muted:#B5BEC4;--accent:#895451;--red:#E0B1B4;--green:#B5CDBB}
html[data-theme="light"]{color-scheme:light;--bg:#EFE8DD;--panel:#EBEBD8;--panel2:#E3DED2;--line:rgba(48,56,65,.16);--text:#303841;--muted:#68737a;--accent:#76ABAE;--red:#a94e58;--green:#34765b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top right,color-mix(in srgb,var(--accent) 18%,transparent),transparent 44%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
.card{width:min(100%,490px);background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 55px #0003}
.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:800}h1{font-size:28px;letter-spacing:-.04em;margin:5px 0}.muted{color:var(--muted);font-size:13px}
label{display:block;color:var(--muted);font-size:12px;margin:15px 0 5px}input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:12px;font:inherit;min-width:0}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--panel2);color:var(--text);font:inherit;font-weight:800;width:100%;margin-top:16px}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.55;cursor:not-allowed}
.status{font-size:13px;min-height:22px;margin-top:13px;color:var(--muted)}.status.good{color:var(--green)}.status.bad{color:var(--red)}a{color:var(--accent)}.links{margin-top:18px;font-size:13px}
.theme-toggle{position:fixed;top:18px;right:18px;width:auto;height:40px;padding:8px 12px;margin:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:16px}
@media(max-width:420px){.card{padding:19px}h1{font-size:25px}}
</style></head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">☀</button>
<main class="card">
<div class="eyebrow">Treasury X1 · Account Security</div>
<h1>Buat password baru</h1>
<p class="muted">Gunakan password baru yang kuat dan jangan bagikan kepada siapa pun.</p>
<section id="loading" class="status" aria-live="polite">Memeriksa tautan pemulihan…</section>
<form id="passwordForm" style="display:none">
<label for="newPassword">Password baru</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Minimal 8 karakter">
<label for="confirmPassword">Konfirmasi password baru</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="Ulangi password baru">
<button id="saveBtn" class="primary" type="submit">Simpan password baru</button>
</form>
<div id="status" class="status" aria-live="polite"></div>
<div class="links"><a href="register.html">← Kembali ke halaman register</a></div>
</main>
<script>
const SUPABASE_URL='https://ynrdhuhykzsuxsbauvkd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_zrvPiE6yzvsfmoHt6hEFFg_Qv82LoKA';
const $=id=>document.getElementById(id);
const recoveryHash=new URLSearchParams(location.hash.slice(1)).get('type')==='recovery';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let recoveryReady=false;
function status(message,type=''){const el=$('status');el.textContent=message;el.className='status'+(type?' '+type:'')}
function enableRecovery(){recoveryReady=true;$('loading').style.display='none';$('passwordForm').style.display='block'}
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session?.user)enableRecovery();
});
(async()=>{
 try{
  const {data,error}=await sb.auth.getSession();if(error)throw error;
  if(recoveryHash&&data.session?.user)enableRecovery();
  else if(!recoveryReady){$('loading').textContent='Tautan pemulihan tidak valid atau sudah kedaluwarsa. Silakan minta tautan baru dari halaman register.';$('loading').className='status bad'}
 }catch(err){$('loading').textContent='Tidak dapat memeriksa tautan: '+(err?.message||'Silakan minta tautan baru.');$('loading').className='status bad'}
})();
$('passwordForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!recoveryReady){status('Sesi pemulihan tidak tersedia. Minta tautan reset baru dari halaman register.','bad');return}
 const password=$('newPassword').value,confirmation=$('confirmPassword').value;
 if(password.length<8){status('Password minimal 8 karakter.','bad');return}
 if(password!==confirmation){status('Konfirmasi password tidak sama.','bad');return}
 $('saveBtn').disabled=true;status('Menyimpan password baru…');
 try{
  const {error}=await sb.auth.updateUser({password});if(error)throw error;
  status('Password berhasil diperbarui. Silakan kembali ke halaman Treasury dan login dengan password baru.','good');
  $('passwordForm').style.display='none';
 }catch(err){status('Password belum berhasil diperbarui: '+(err?.message||'Terjadi kesalahan.'),'bad')}
 finally{$('saveBtn').disabled=false}
});
(()=>{const root=document.documentElement,btn=$('themeToggle'),meta=document.querySelector('meta[name="theme-color"]');const apply=t=>{const dark=t==='dark';root.dataset.theme=dark?'dark':'light';btn.textContent=dark?'☀':'☾';btn.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');if(meta)meta.content=dark?'#303841':'#EFE8DD'};let saved=null;try{saved=localStorage.getItem('ramaspace-theme')}catch(e){}apply(saved==='light'?'light':'dark');btn.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';apply(next);try{localStorage.setItem('ramaspace-theme',next)}catch(e){}})})();
</script></body></html>
